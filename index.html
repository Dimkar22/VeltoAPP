<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Velto Messenger</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== ЛУННАЯ ТЕМА (по умолчанию) ===== */
    :root {
      --bg-space: #050610;
      --bg-gradient-1: #050610;
      --bg-gradient-2: #0d0f1f;
      --moon-glow: rgba(34, 197, 94, 0.15);
      --moon-surface: #1a1d33;
      --glass-base: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 255, 255, 0.1);
      --glass-strong: rgba(255, 255, 255, 0.07);
      --primary: #22c55e;
      --primary-2: #15803d;
      --primary-glow: rgba(34, 197, 94, 0.4);
      --accent: #86efac;
      --text-main: #ffffff;
      --text-muted: #a1a6c1;
      --danger: #ff5e5e;
      --success: #4ade80;
      --warning: #fbbf24;
      --bubble-self: linear-gradient(135deg, #22c55e, #15803d);
      --bubble-other: rgba(255, 255, 255, 0.08);
      --sidebar-bg: rgba(10, 12, 26, 0.85);
      --sidebar-border: rgba(255, 255, 255, 0.08);
      --star-color: white;
      --star-opacity: 0.6;
      --moon-display: flex;
      --sun-display: none;
      --theme-name: "velto";
      --welcome-emoji: "🌙";
      --body-shadow: rgba(34, 197, 94, 0.3);
    }

    /* ===== СОЛНЕЧНАЯ ТЕМА ===== */
    body.theme-solar {
      --bg-space: #1a1024;
      --bg-gradient-1: #1a1024;
      --bg-gradient-2: #2d1b3d;
      --moon-glow: rgba(255, 165, 0, 0.12);
      --moon-surface: #3d2858;
      --glass-base: rgba(255, 200, 100, 0.04);
      --glass-border: rgba(255, 200, 100, 0.15);
      --glass-strong: rgba(255, 200, 100, 0.08);
      --primary: #ff8c00;
      --primary-2: #ff6b00;
      --primary-glow: rgba(255, 140, 0, 0.4);
      --accent: #ffd700;
      --text-main: #fff8e7;
      --text-muted: #d4a76a;
      --danger: #ff5e5e;
      --success: #4ade80;
      --warning: #fbbf24;
      --bubble-self: linear-gradient(135deg, #ff8c00, #ff6b00);
      --bubble-other: rgba(255, 200, 100, 0.08);
      --sidebar-bg: rgba(26, 16, 36, 0.85);
      --sidebar-border: rgba(255, 200, 100, 0.1);
      --star-color: #ffd700;
      --star-opacity: 0.4;
      --moon-display: none;
      --sun-display: flex;
      --theme-name: "Solar";
      --welcome-emoji: "☀";
      --body-shadow: rgba(255, 140, 0, 0.3);
    }


    /* ===== ТЕМА ЮПИТЕР (атмосферная) ===== */
    body.theme-jupiter {
      --bg-space: #0c0604;
      --bg-gradient-1: #120805;
      --bg-gradient-2: #2a1408;
      --moon-glow: rgba(255, 140, 60, 0.18);
      --moon-surface: #3d2412;
      --glass-base: rgba(255, 200, 140, 0.055);
      --glass-border: rgba(255, 180, 100, 0.22);
      --glass-strong: rgba(255, 190, 120, 0.11);
      --primary: #ff8c42;
      --primary-2: #e05a20;
      --primary-glow: rgba(255, 140, 66, 0.48);
      --accent: #ffe0a8;
      --text-main: #fff6eb;
      --text-muted: #d4b08a;
      --bubble-self: linear-gradient(135deg, #ff8c42, #c44a18);
      --bubble-other: rgba(255, 200, 140, 0.11);
      --sidebar-bg: rgba(18, 8, 4, 0.88);
      --sidebar-border: rgba(255, 170, 90, 0.16);
      --star-color: #ffd9a0;
      --star-opacity: 0.35;
      --moon-display: none;
      --sun-display: none;
      --theme-name: "Jupiter";
      --welcome-emoji: "🪐";
      --body-shadow: rgba(255, 120, 40, 0.35);
    }
    body.theme-jupiter { background: #0c0604; animation: none; }
    body.theme-jupiter .moon-visual,
    body.theme-jupiter .sun-visual,
    body.theme-jupiter .planet-ring { display: none; }
    body.theme-jupiter .chat-area { background: rgba(8, 3, 1, 0.32); }
    body.theme-jupiter .message.self { box-shadow: 0 4px 22px rgba(255, 100, 30, 0.35); }
    body.theme-jupiter .sidebar { box-shadow: 4px 0 40px rgba(255, 90, 20, 0.12); }

    .jupiter-layer { display: none; overflow: hidden; z-index: 0; pointer-events: none; }
    body.theme-jupiter .jupiter-layer { display: block; }
    .jup-stars {
      position: absolute; inset: -5%; opacity: 0.55;
      background-image:
        radial-gradient(1.5px 1.5px at 8% 12%, #ffe8c0 0%, transparent 100%),
        radial-gradient(1px 1px at 22% 28%, #ffd090 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 45% 8%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 68% 22%, #ffc070 0%, transparent 100%),
        radial-gradient(2px 2px at 85% 15%, #ffe0b0 0%, transparent 100%),
        radial-gradient(1px 1px at 12% 55%, #fff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 38% 70%, #ffd8a0 0%, transparent 100%),
        radial-gradient(1px 1px at 72% 65%, #ffe8c8 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 48%, #ffc888 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 55% 88%, #fff 0%, transparent 100%);
      animation: jupStarTwinkle 12s ease-in-out infinite;
    }
    .jup-bands {
      position: absolute; top: -22%; bottom: -22%; left: -45%; width: 190%;
      background: linear-gradient(180deg,
        #1a0c06 0%, #8b4520 6%, #e8b878 11%, #c46830 16%, #2a140a 22%,
        #f0c890 27%, #a05028 33%, #3a1c0e 39%, #d98848 45%, #1a0c06 51%,
        #e8c8a0 57%, #944828 63%, #f5d4a8 69%, #5a2814 75%, #d07038 81%,
        #2a140a 87%, #c88850 93%, #1a0c06 100%);
      filter: url(#jup-warp);
      opacity: 0.72;
      animation: jupDrift 120s ease-in-out infinite alternate;
      will-change: transform;
    }
    .jup-bands.b2 {
      top: -35%; bottom: -35%; opacity: 0.38;
      background: linear-gradient(180deg,
        #f0d0a0 0%, #6a3018 10%, #e89850 18%, #1a0c06 26%, #f5d8b0 34%,
        #b85828 42%, #3a1c10 50%, #d89860 58%, #5a2814 66%, #e8b870 74%,
        #2a140a 82%, #c07040 90%, #f0d0a0 100%);
      filter: url(#jup-warp2);
      animation: jupDriftRev 85s ease-in-out infinite alternate;
      mix-blend-mode: screen;
    }
    .jup-spot {
      position: absolute; left: 62%; top: 58%;
      width: min(420px, 55vw); height: min(240px, 32vw);
      margin: calc(min(240px, 32vw) / -2) 0 0 calc(min(420px, 55vw) / -2);
      border-radius: 50%;
      background:
        radial-gradient(ellipse 70% 60% at 45% 45%, rgba(180, 40, 20, 0.95) 0%, rgba(220, 80, 30, 0.7) 35%, rgba(255, 140, 60, 0.25) 60%, transparent 78%),
        radial-gradient(ellipse 90% 70% at 55% 55%, rgba(120, 25, 10, 0.6) 0%, transparent 70%);
      filter: blur(10px);
      animation: jupSpot 45s ease-in-out infinite alternate;
      box-shadow: 0 0 60px 20px rgba(255, 80, 30, 0.15);
    }
    .jup-spot::before {
      content: ""; position: absolute; inset: 18% 22%;
      border-radius: 50%;
      background: radial-gradient(ellipse at 40% 40%, rgba(255, 100, 50, 0.5), transparent 70%);
      filter: blur(8px);
      animation: jupSpotCore 8s ease-in-out infinite;
    }
    .jup-spot::after {
      content: ""; position: absolute; inset: -18%; border-radius: 50%;
      background: conic-gradient(from 20deg, transparent 0%, rgba(255,200,140,.4) 10%, transparent 28%, rgba(255,160,80,.3) 50%, transparent 70%, rgba(255,210,160,.35) 88%, transparent 100%);
      -webkit-mask: radial-gradient(ellipse at center, transparent 32%, #000 55%, transparent 78%);
              mask: radial-gradient(ellipse at center, transparent 32%, #000 55%, transparent 78%);
      animation: jupSwirl 28s linear infinite;
    }
    .jup-moon {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e8d4b8, #a89070 50%, #5a4830 85%);
      box-shadow: 0 0 20px rgba(255, 200, 140, 0.25), inset -4px -4px 10px rgba(0,0,0,.35);
      animation: jupMoonOrbit 40s linear infinite;
    }
    .jup-moon.m1 { width: 28px; height: 28px; left: 18%; top: 22%; animation-duration: 55s; }
    .jup-moon.m2 { width: 16px; height: 16px; left: 78%; top: 35%; background: radial-gradient(circle at 40% 35%, #d0c8e0, #706890 60%, #302838); animation-duration: 32s; animation-direction: reverse; }
    .jup-moon.m3 { width: 12px; height: 12px; left: 30%; top: 72%; background: radial-gradient(circle at 40% 35%, #c8e0f0, #6080a0 55%, #203040); animation-duration: 70s; }
    .jup-aurora {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 50% 18% at 50% 0%, rgba(100, 180, 255, 0.12), transparent 70%),
        radial-gradient(ellipse 45% 15% at 50% 100%, rgba(255, 120, 60, 0.14), transparent 65%);
      animation: jupBreath 7s ease-in-out infinite;
      mix-blend-mode: screen;
    }
    .jup-glow {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 90% 50% at 50% 110%, rgba(255, 120, 40, 0.42), transparent 65%),
        radial-gradient(ellipse 55% 35% at 20% -8%, rgba(255, 180, 80, 0.14), transparent 60%),
        radial-gradient(ellipse 40% 30% at 80% 30%, rgba(255, 100, 40, 0.1), transparent 55%);
      animation: jupBreath 9s ease-in-out infinite;
    }
    .jup-shade {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 42%, rgba(8,3,1,.12) 0%, rgba(8,3,1,.55) 55%, rgba(8,3,1,.78) 100%);
    }
    body.theme-jupiter .auth-switch-btn.active { background: linear-gradient(135deg, rgba(255,140,66,.42), rgba(192,74,24,.22)); box-shadow: inset 0 0 0 1px rgba(255,224,168,.35); }
    body.theme-jupiter .settings-tab.active,
    body.theme-jupiter .settings-card .settings-tab.active { background: linear-gradient(135deg, rgba(255,140,66,.32), rgba(192,74,24,.16)); border-color: rgba(255,224,168,.4); }
    @keyframes jupDrift    { from { transform: translateX(0); }      to { transform: translateX(-24%); } }
    @keyframes jupDriftRev { from { transform: translateX(-24%); }   to { transform: translateX(0); } }
    @keyframes jupSpot     { from { transform: translate(-18px, 8px) scale(1); } to { transform: translate(22px, -10px) scale(1.08); } }
    @keyframes jupSpotCore { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.12); } }
    @keyframes jupSwirl    { to { transform: rotate(360deg); } }
    @keyframes jupBreath   { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
    @keyframes jupStarTwinkle { 0%, 100% { opacity: 0.4; } 50% { opacity: 0.7; } }
    @keyframes jupMoonOrbit {
      0% { transform: translate(0, 0); }
      25% { transform: translate(12px, -8px); }
      50% { transform: translate(4px, 10px); }
      75% { transform: translate(-10px, 4px); }
      100% { transform: translate(0, 0); }
    }
    @media (prefers-reduced-motion: reduce) {
      body.theme-jupiter .jup-bands,
      body.theme-jupiter .jup-spot,
      body.theme-jupiter .jup-moon,
      body.theme-jupiter .jup-glow,
      body.theme-jupiter .jup-aurora,
      body.theme-jupiter .jup-stars { animation: none !important; }
    }


    /* ===== ТЕМА АНДРОМЕДА ===== */
    body.theme-andromeda {
      --bg-space: #04030e;
      --bg-gradient-1: #04030e;
      --bg-gradient-2: #0b0a26;
      --moon-glow: rgba(110, 130, 255, 0.15);
      --moon-surface: #1a1b45;
      --glass-base: rgba(170, 185, 255, 0.04);
      --glass-border: rgba(160, 175, 255, 0.17);
      --glass-strong: rgba(160, 175, 255, 0.085);
      --primary: #4f8cff;
      --primary-2: #8a4dff;
      --primary-glow: rgba(98, 120, 255, 0.45);
      --accent: #ff9ad5;
      --text-main: #eef2ff;
      --text-muted: #9aa6d6;
      --bubble-self: linear-gradient(135deg, #4f8cff, #8a4dff);
      --bubble-other: rgba(160, 175, 255, 0.09);
      --sidebar-bg: rgba(6, 6, 24, 0.8);
      --sidebar-border: rgba(160, 175, 255, 0.12);
      --star-color: #d5deff;
      --star-opacity: 0.55;
      --moon-display: none;
      --sun-display: none;
      --theme-name: "Andromeda";
      --welcome-emoji: "🌌";
      --body-shadow: rgba(98, 120, 255, 0.3);
    }
    body.theme-andromeda { background: #04030e; animation: none; }
    body.theme-andromeda .moon-visual,
    body.theme-andromeda .sun-visual,
    body.theme-andromeda .planet-ring { display: none; }
    body.theme-andromeda .chat-area { background: rgba(3, 3, 14, 0.3); }
    body.theme-andromeda .auth-switch-btn.active { background: linear-gradient(135deg, rgba(79,140,255,.35), rgba(138,77,255,.2)); box-shadow: inset 0 0 0 1px rgba(160,175,255,.3); }
    body.theme-andromeda .settings-tab.active { background: linear-gradient(135deg, rgba(79,140,255,.28), rgba(138,77,255,.14)); border-color: rgba(160,175,255,.35); }

    .andro-layer { display: none; overflow: hidden; z-index: 0; }
    body.theme-andromeda .andro-layer { display: block; }
    .andro-nebula {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 55% 40% at 78% 18%, rgba(255,120,200,.16), transparent 70%),
        radial-gradient(ellipse 60% 45% at 18% 82%, rgba(70,110,255,.2), transparent 70%),
        radial-gradient(ellipse 45% 35% at 90% 85%, rgba(140,80,255,.16), transparent 70%),
        radial-gradient(ellipse 40% 30% at 8% 12%, rgba(80,200,255,.1), transparent 70%);
      animation: androBreath 12s ease-in-out infinite;
    }
    .andro-tilt {
      position: absolute; left: 50%; top: 47%;
      width: min(1700px, 190vmax); height: min(1700px, 190vmax);
      margin-left: calc(min(1700px, 190vmax) / -2); margin-top: calc(min(1700px, 190vmax) / -2);
      transform: rotate(-27deg) scaleY(.34);
    }
    .andro-spin { width: 100%; height: 100%; display: block; animation: androSpin 420s linear infinite; }
    .andro-companion {
      position: absolute; border-radius: 50%; filter: blur(5px);
      background: radial-gradient(ellipse at center, rgba(255,235,200,.75), rgba(200,190,255,.25) 45%, transparent 72%);
    }
    .andro-companion.m32 { left: 61%; top: 36%; width: 46px; height: 38px; transform: rotate(-20deg); }
    .andro-companion.m110 { left: 23%; top: 63%; width: 110px; height: 52px; transform: rotate(-35deg); opacity: .7; }
    .andro-shade {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% 46%, rgba(2,2,10,.1) 0%, rgba(2,2,10,.6) 100%);
    }
    @keyframes androSpin { to { transform: rotate(360deg); } }
    @keyframes androBreath { 0%, 100% { opacity: .75; } 50% { opacity: 1; } }


    /* ===== ТЕМА ЧЁРНАЯ ДЫРА ===== */
    body.theme-blackhole {
      --bg-space: #000000;
      --bg-gradient-1: #000000;
      --bg-gradient-2: #0a0612;
      --moon-glow: rgba(180, 100, 255, 0.12);
      --moon-surface: #120818;
      --glass-base: rgba(180, 140, 255, 0.04);
      --glass-border: rgba(200, 160, 255, 0.16);
      --glass-strong: rgba(180, 140, 255, 0.09);
      --primary: #b85cff;
      --primary-2: #6b2fff;
      --primary-glow: rgba(184, 92, 255, 0.45);
      --accent: #ff6bcb;
      --text-main: #f4eeff;
      --text-muted: #a894c4;
      --bubble-self: linear-gradient(135deg, #b85cff, #6b2fff);
      --bubble-other: rgba(180, 140, 255, 0.09);
      --sidebar-bg: rgba(4, 2, 10, 0.88);
      --sidebar-border: rgba(180, 140, 255, 0.12);
      --star-color: #e8d4ff;
      --star-opacity: 0.45;
      --moon-display: none;
      --sun-display: none;
      --theme-name: "Black Hole";
      --welcome-emoji: "🕳️";
      --body-shadow: rgba(184, 92, 255, 0.35);
    }
    body.theme-blackhole { background: #000000; animation: none; }
    body.theme-blackhole .moon-visual,
    body.theme-blackhole .sun-visual,
    body.theme-blackhole .planet-ring { display: none; }
    body.theme-blackhole .chat-area { background: rgba(0, 0, 0, 0.35); }
    body.theme-blackhole .auth-switch-btn.active {
      background: linear-gradient(135deg, rgba(184,92,255,.38), rgba(107,47,255,.2));
      box-shadow: inset 0 0 0 1px rgba(255,107,203,.3);
    }
    body.theme-blackhole .settings-tab.active,
    body.theme-blackhole .settings-card .settings-tab.active {
      background: linear-gradient(135deg, rgba(184,92,255,.3), rgba(107,47,255,.14));
      border-color: rgba(200,160,255,.35);
    }

    .bh-layer { display: none; overflow: hidden; z-index: 0; pointer-events: none; }
    body.theme-blackhole .bh-layer { display: block; }

    .bh-stars {
      position: absolute; inset: -10%;
      background-image:
        radial-gradient(1.5px 1.5px at 6% 10%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 14% 28%, #e8d4ff 0%, transparent 100%),
        radial-gradient(2px 2px at 22% 8%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 31% 42%, #c8b8ff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 38% 15%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 47% 33%, #ffd4f0 0%, transparent 100%),
        radial-gradient(2px 2px at 55% 6%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 63% 48%, #b8c8ff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 72% 18%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 81% 36%, #e0d0ff 0%, transparent 100%),
        radial-gradient(2px 2px at 90% 12%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 95% 44%, #ffc8e8 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 4% 55%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 12% 72%, #d4c8ff 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 25% 88%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 40% 65%, #c0d0ff 0%, transparent 100%),
        radial-gradient(2px 2px at 58% 92%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 70%, #ffd0e8 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 82%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 93% 60%, #e8e0ff 0%, transparent 100%),
        radial-gradient(1px 1px at 48% 52%, rgba(255,200,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 18% 50%, rgba(200,220,255,.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 76% 55%, rgba(255,180,220,.3) 0%, transparent 100%);
      animation: bhStarDrift 90s ease-in-out infinite;
      opacity: 0.85;
    }

    .bh-nebula {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 70% 55% at 50% 50%, rgba(90, 40, 160, 0.18) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 30% 70%, rgba(40, 60, 140, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse 45% 35% at 75% 25%, rgba(140, 30, 100, 0.1) 0%, transparent 50%);
      animation: bhGlowPulse 10s ease-in-out infinite;
    }

    .bh-center {
      position: absolute;
      left: 50%; top: 50%;
      width: min(960px, 120vmin); height: min(960px, 120vmin);
      transform: translate(-50%, -50%);
      perspective: 1400px;
      transform-style: preserve-3d;
    }

    /* Outer soft halo */
    .bh-halo {
      position: absolute; inset: -5%;
      border-radius: 50%;
      background: radial-gradient(circle,
        transparent 28%,
        rgba(255, 140, 80, 0.06) 38%,
        rgba(180, 80, 220, 0.1) 48%,
        rgba(80, 60, 180, 0.08) 58%,
        transparent 72%);
      animation: bhLensBreath 7s ease-in-out infinite;
      filter: blur(4px);
    }

    /* Main accretion disk — warm EHT palette */
    .bh-accretion {
      position: absolute; inset: -6%;
      border-radius: 50%;
      background: conic-gradient(from 210deg,
        rgba(255, 90, 40, 0) 0deg,
        rgba(255, 160, 60, 0.35) 25deg,
        rgba(255, 100, 40, 0.75) 55deg,
        rgba(255, 50, 80, 0.85) 85deg,
        rgba(220, 40, 160, 0.7) 115deg,
        rgba(140, 60, 255, 0.55) 145deg,
        rgba(60, 120, 255, 0.4) 175deg,
        rgba(40, 180, 255, 0.35) 200deg,
        rgba(255, 200, 100, 0.45) 235deg,
        rgba(255, 120, 50, 0.8) 280deg,
        rgba(255, 60, 100, 0.65) 320deg,
        rgba(255, 90, 40, 0) 360deg);
      filter: blur(14px) saturate(1.25);
      animation: bhSpin 32s linear infinite;
      opacity: 0.95;
      -webkit-mask-image: radial-gradient(ellipse 58% 26% at 50% 50%, transparent 34%, #000 44%, #000 70%, transparent 88%);
              mask-image: radial-gradient(ellipse 58% 26% at 50% 50%, transparent 34%, #000 44%, #000 70%, transparent 88%);
      transform: rotateX(74deg) scaleY(0.38);
    }

    .bh-accretion-inner {
      position: absolute; inset: 8%;
      border-radius: 50%;
      background: conic-gradient(from 40deg,
        transparent 0deg,
        rgba(255, 220, 140, 0.55) 30deg,
        rgba(255, 140, 50, 0.95) 70deg,
        rgba(255, 70, 90, 0.85) 110deg,
        rgba(200, 50, 200, 0.6) 150deg,
        rgba(100, 100, 255, 0.45) 190deg,
        rgba(255, 180, 80, 0.7) 250deg,
        rgba(255, 100, 50, 0.9) 300deg,
        transparent 340deg);
      filter: blur(7px) saturate(1.3);

    .bh-horizon {
      position: absolute;

    /* Doppler-bright crescent on the approaching side */
    .bh-crescent {
      position: absolute;
      left: 50%; top: 50%;
      width: 20%; height: 20%;
      margin-left: -10%; margin-top: -10%;
      border-radius: 50%;

      filter: blur(8px);

    .bh-lens {

    .bh-glow {
      position: absolute; inset: 0;

        radial-gradient(ellipse 50% 40% at 50% 50%, rgba(200, 100, 255, 0.2) 0%, transparent 60%),

      animation: bhGlowPulse 8s ease-in-out infinite;
    }

    .bh-jet {
      position: absolute;
      left: 50%; top: 50%;
      width: 14px; height: 72vmin;
      transform: translate(-50%, -100%);
      background: linear-gradient(to top,
        rgba(200, 120, 255, 0.55) 0%,

    .bh-jet::after {

    .bh-jet.down {

        rgba(200, 120, 255, 0.5) 0%,

      opacity: 0.48;
      animation-delay: -2.5s;
    }
    .bh-jet.down::after { display: none; }

    .bh-sparks {

      background-image:
        radial-gradient(2px 2px at 42% 48%, rgba(255,220,160,.9), transparent),
        radial-gradient(1.5px 1.5px at 58% 52%, rgba(255,180,120,.8), transparent),

      opacity: 0.7;
      filter: blur(0.5px);

    .bh-shade {
      position: absolute; inset: 0;

      background: linear-gradient(135deg, #ff6b1a, #ffd166) !important;
      box-shadow: 0 0 50px rgba(255,107,26,.5) !important;
    }
    body.theme-halloween .message.self {
      box-shadow: 0 4px 18px rgba(255,107,26,.4);
    }
    body.theme-halloween .sidebar {
      box-shadow: 4px 0 30px rgba(255,80,20,.15);
    }
    body.theme-halloween .theme-toggle {
      border-color: rgba(255,140,60,.4);
    }

    .halloween-layer { display: none; overflow: hidden; z-index: 0; pointer-events: none; }
    body.theme-halloween .halloween-layer { display: block; }

    /* Ночной огород — только грядки */
    .hw-sky {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, #0a0610 0%, #120810 35%, #1a0c10 55%, #1a1208 100%),
        radial-gradient(ellipse 60% 40% at 70% 8%, rgba(80, 30, 20, 0.35), transparent 60%),
        radial-gradient(ellipse 50% 30% at 20% 15%, rgba(40, 20, 60, 0.25), transparent 55%);
    }
    .hw-stars-night {
      position: absolute; inset: 0; opacity: 0.5; pointer-events: none;
      background-image:
        radial-gradient(1px 1px at 10% 12%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 8%, rgba(255,200,180,.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 40% 18%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 6%, rgba(255,220,200,.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 14%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 85% 10%, rgba(255,200,180,.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 28%, #fff 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 22%, rgba(255,220,200,.55) 0%, transparent 100%);
    }
    .hw-moon {
      position: absolute; top: 4%; right: 10%;
      width: min(120px, 18vw); height: min(120px, 18vw);
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #c8b090, #8a7050 45%, #4a3820 75%, #1a1008);
      box-shadow: 0 0 40px 10px rgba(180, 140, 80, 0.2), 0 0 80px 20px rgba(100, 60, 20, 0.12);
      opacity: 0.85;
      animation: hwMoonFloat 18s ease-in-out infinite;
    }
    .hw-moon::after {
      content: ""; position: absolute;
      width: 22%; height: 22%; border-radius: 50%; background: rgba(40, 30, 20, 0.35);
      top: 30%; left: 45%;
      box-shadow: 18px 14px 0 rgba(30, 22, 12, 0.3), -10px 22px 0 rgba(35, 25, 15, 0.25);
    }
    .hw-ground {
      position: absolute; left: 0; right: 0; bottom: 0; height: 48%;
      background:
        linear-gradient(180deg, transparent 0%, rgba(30, 18, 8, 0.5) 8%, #1a120a 22%, #14100a 100%);
    }
    .hw-beds {
      position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
      background:
        repeating-linear-gradient(
          90deg,
          transparent 0px,
          transparent 28px,
          rgba(20, 12, 6, 0.55) 28px,
          rgba(20, 12, 6, 0.55) 36px
        ),
        repeating-linear-gradient(
          0deg,
          #1c140c 0px,
          #1c140c 18px,
          #15100a 18px,
          #15100a 22px,
          #221810 22px,
          #221810 40px
        );
      opacity: 0.95;
      mask-image: linear-gradient(to top, #000 55%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, #000 55%, transparent 100%);
    }
    .hw-beds::before {
      content: "";
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, transparent 0%, transparent 35%, rgba(40, 28, 14, 0.7) 42%, rgba(25, 16, 8, 0.9) 50%, transparent 58%),
        linear-gradient(180deg, transparent 0%, transparent 55%, rgba(38, 26, 12, 0.65) 62%, rgba(22, 14, 7, 0.85) 70%, transparent 78%),
        linear-gradient(180deg, transparent 0%, transparent 72%, rgba(42, 30, 14, 0.6) 78%, rgba(20, 12, 6, 0.8) 86%, transparent 94%);
      pointer-events: none;
    }
    .hw-beds::after {
      content: "";
      position: absolute; left: 0; right: 0; bottom: 0; height: 100%;
      background:
        radial-gradient(ellipse 3px 14px at 12% 48%, #2a1e10 0%, transparent 70%),
        radial-gradient(ellipse 2px 10px at 28% 55%, #241a0c 0%, transparent 70%),
        radial-gradient(ellipse 3px 12px at 45% 42%, #2c2012 0%, transparent 70%),
        radial-gradient(ellipse 2px 9px at 62% 58%, #1e160a 0%, transparent 70%),
        radial-gradient(ellipse 3px 11px at 78% 50%, #281c10 0%, transparent 70%),
        radial-gradient(ellipse 2px 8px at 90% 60%, #22180c 0%, transparent 70%);
      opacity: 0.7;
    }
    .hw-fog {
      position: absolute; bottom: 0; left: 0; right: 0; height: 42%;
      background:
        linear-gradient(to top, rgba(20, 10, 8, 0.55), transparent 70%),
        radial-gradient(ellipse 80% 40% at 40% 90%, rgba(40, 20, 15, 0.3), transparent 60%);
      animation: hwFog 14s ease-in-out infinite;
    }
    .hw-shade {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse at 50% 35%, transparent 0%, rgba(5, 2, 4, 0.35) 50%, rgba(5, 2, 4, 0.65) 100%);
    }
    @keyframes hwMoonFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    @keyframes hwFog { 0%,100%{opacity:.65} 50%{opacity:1} }

    .halloween-banner {
      position: fixed; inset: 0; z-index: 300;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,.75); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0; pointer-events: none; transition: opacity .45s ease;
    }
    .halloween-banner.show { opacity: 1; pointer-events: auto; }
    .halloween-banner-card {
      text-align: center; padding: 40px 36px; max-width: min(440px, 92vw);
      border-radius: 28px;
      background: linear-gradient(145deg, rgba(42,14,22,.99), rgba(16,6,12,.99));
      border: 1px solid rgba(255,140,60,.4);
      box-shadow: 0 0 70px rgba(255,107,26,.4), 0 25px 90px rgba(0,0,0,.65);
      animation: hwBannerIn .75s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .halloween-banner-emoji {
      font-size: 68px; line-height: 1; margin-bottom: 14px;
      filter: drop-shadow(0 0 24px rgba(255,140,40,.65));
      animation: hwBounce 1.3s ease-in-out infinite;
    }
    .halloween-banner-title {
      font-size: 30px; font-weight: 800; letter-spacing: -0.6px;
      background: linear-gradient(90deg, #ff6b1a, #ffd166, #ff6b1a);
      background-size: 200% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; animation: shimmer 3s linear infinite;
      margin-bottom: 10px;
    }
    .halloween-banner-sub {
      font-size: 14px; color: #c9a07a; line-height: 1.55; margin-bottom: 24px;
    }
    .halloween-banner-card .primary-btn {
      min-width: 170px; box-shadow: 0 6px 24px rgba(255,107,26,.45);
    }
    @keyframes hwBannerIn {
      from { opacity: 0; transform: scale(0.72) translateY(28px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes hwBounce {
      0%,100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-12px) rotate(5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      body.theme-halloween .hw-moon,
      body.theme-halloween .hw-fog,
      .halloween-banner-emoji { animation: none !important; }
    }
