<style>
:root{--accent:#35d07f;--accent-soft:#183b2a;--bg:#0c110e;--panel:#151d18;--text:#edf7f0;--muted:#91a59a;--line:#26352c;--sidebar:#101713;--selected:#19271f;--bubble:#1d2922;--modal:#111a14;--field:#0c120e;--secondary:#202d24}
body[data-theme="light"]{--accent:#16834a;--accent-soft:#d9f5e5;--bg:#f4f7f5;--panel:#ffffff;--text:#17211b;--muted:#64736a;--line:#d9e2dc;--sidebar:#ffffff;--selected:#e6f4eb;--bubble:#e5ece7;--modal:#ffffff;--field:#f7faf8;--secondary:#e9efeb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{height:100dvh;max-width:1100px;margin:auto;display:flex;overflow:hidden;border-inline:1px solid var(--line)}
.sidebar{width:350px;max-width:42%;border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--sidebar)}.top{padding:18px 18px 12px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:750;letter-spacing:-.7px}.logo{width:38px;height:38px;border-radius:12px;display:block;object-fit:contain;flex:none;background:var(--panel);padding:2px;box-sizing:border-box;transition:background-color .18s ease}.iconbtn{border:0;background:transparent;color:var(--muted);font-size:21px;width:38px;height:38px;border-radius:12px}
.theme-toggle{font-size:21px;line-height:1;transition:transform .22s ease,color .22s ease,background .22s ease}.theme-toggle:active{transform:rotate(-18deg) scale(.92)}.theme-toggle.is-light{color:#b77908}
.iconbtn:hover{background:var(--panel)}.search{margin:4px 14px 14px;display:flex;background:var(--panel);border-radius:13px;padding:10px 12px;gap:8px;color:var(--muted)}.search input{border:0;background:transparent;outline:0;width:100%;color:var(--text)}.tabs{display:flex;padding:0 14px 8px;gap:6px;overflow-x:auto;scrollbar-width:thin} .tabs[hidden],.search[hidden],#chatlist[hidden]{display:none!important}.tab{flex:none;border:0;background:transparent;color:var(--muted);padding:8px 11px;border-radius:10px;font-size:13px}.tab.active{background:var(--accent-soft);color:var(--accent);font-weight:650}.chatlist{overflow:auto}.chat{display:flex;gap:11px;padding:12px 15px;align-items:center;cursor:pointer}.chat:hover,.chat.selected{background:var(--selected)}.chatmenu{flex:none;width:30px;height:34px;font-size:20px;opacity:.7}.chatmenu:hover{opacity:1;background:var(--panel)}.avatar{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:#80a6bf;font-size:17px}.a2{background:#b48bce}.a3{background:#d7a15b}.a4{background:#5dafa0}.a5{background:#d47e8b}.chatbody{min-width:0;flex:1}.chatrow{display:flex;justify-content:space-between;gap:8px}.chatname{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time,.preview{font-size:12px;color:var(--muted)}.preview{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.unread{background:var(--accent);color:#fff;border-radius:20px;padding:1px 6px;font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}.empty{margin:auto;text-align:center;color:var(--muted);padding:28px}.empty .big{width:82px;height:82px;border-radius:28px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:38px;margin:0 auto 16px}.conversation{display:none;flex:1;min-height:0;flex-direction:column}.convhead{padding:13px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}.convhead .avatar{width:42px;height:42px}.person{font-weight:700}.online{font-size:12px;color:var(--accent)}.messages{flex:1;overflow:auto;padding:22px 5%;display:flex;flex-direction:column;gap:12px;background:linear-gradient(var(--bg),var(--sidebar))}.bubble{max-width:78%;padding:10px 13px;border-radius:var(--chat-bubble-radius,16px);font-size:var(--chat-font-size,15px);background:var(--bubble);color:var(--text);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}.bubble.mine{background:var(--accent-soft);color:var(--text);align-self:flex-end;border-radius:var(--chat-bubble-radius,16px)}.bubble{user-select:none;-webkit-user-select:none;touch-action:pan-y}.convhead #call,.convhead #videoCall{font-size:18px;display:inline-flex;align-items:center;justify-content:center;flex:none;color:var(--accent);background:var(--accent-soft)}.voice-recording{background:#c43b45!important;color:#fff!important;transform:scale(1.06);transition:background .18s ease,transform .18s ease,opacity .22s ease}.voice-hint{position:fixed;z-index:60;left:50%;bottom:100px;transform:translateX(-50%);padding:11px 16px;border-radius:24px;background:var(--modal);color:var(--text);border:1px solid var(--line);box-shadow:0 8px 30px #0004;opacity:0;transition:opacity .2s ease;pointer-events:none;white-space:nowrap}.voice-hint.visible{opacity:1}.bubble audio{display:block;max-width:min(260px,65vw);margin:5px 0}.stamp{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:4px}.composer{padding:12px 15px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}.composeinput{flex:1;min-width:0;border:0;background:var(--panel);color:var(--text);caret-color:var(--accent);padding:12px 15px;border-radius:22px;outline:none}.composeinput::placeholder,input::placeholder{color:var(--muted);opacity:1}.composeinput:focus{box-shadow:0 0 0 2px var(--accent-soft)}.send{border:0;background:var(--accent);color:#fff;width:44px;height:44px;border-radius:50%;font-size:19px}.mobileback{display:none}.bottomnav{display:flex;justify-content:space-around;gap:2px;border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));margin-top:auto}.section-heading{padding:14px 16px 6px;font-size:20px;font-weight:750}.section-subtitle{padding:0 16px 12px;color:var(--muted);font-size:13px}.section-card{display:flex;align-items:center;gap:12px;margin:8px 12px;padding:12px;border:1px solid var(--line);background:var(--panel);border-radius:14px;color:var(--text)}.section-card .avatar{width:44px;height:44px}.section-card-body{flex:1;min-width:0}.section-card small{display:block;color:var(--muted);margin-top:3px}.section-action{border:0;border-radius:10px;padding:8px 10px;background:var(--accent-soft);color:var(--accent);font-weight:650}.section-empty{margin:28px 18px;padding:24px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.navitem{flex:1;min-width:0;border:0;background:none;color:var(--muted);font-size:11px;display:flex;flex-direction:column;gap:3px;align-items:center;padding:5px 2px}.navitem b{font-size:20px;font-weight:500;line-height:1.2}.navitem.active{color:var(--accent)}.notice{font-size:12px;color:var(--muted);text-align:center;padding:8px 14px}
@media(max-width:650px){.app{border:0}.sidebar{width:100%;max-width:none;border:0}.main{display:none}.app.chat-open .sidebar{display:none}.app.chat-open .main{display:flex;width:100%}.mobileback{display:inline-block}.bottomnav{display:flex;justify-content:space-around}.chatlist{padding-bottom:8px}.messages{padding:16px 4%}.bubble{max-width:88%}}

.authgate{position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--text);display:grid;place-items:center;padding:22px;overflow:auto}
.authgate[hidden]{display:none}.recovery-panel{margin-top:14px}.recovery-panel[hidden]{display:none}.authcard{width:min(100%,420px);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:0 20px 70px #0004}.authbrand{display:flex;align-items:center;justify-content:center;gap:12px;font-size:30px;font-weight:800;margin:4px 0 8px}.authbrand img{width:58px;height:58px;object-fit:contain;border-radius:15px}.authsubtitle{text-align:center;color:var(--muted);margin:0 0 22px}.authswitch{display:flex;gap:8px;margin:16px 0}.authswitch button{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);padding:10px;border-radius:11px}.authswitch button.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text)}.authnote{font-size:12px;color:var(--muted);line-height:1.45;margin-top:15px}.autherror{color:#ff7b7b;font-size:13px;margin-top:10px;min-height:18px}

/* iOS-style bottom navigation and smooth chat opening */
.bottomnav{flex-shrink:0;align-items:stretch;gap:0;border-top:1px solid color-mix(in srgb,var(--line) 75%,transparent);background:var(--sidebar);padding:7px 7px calc(7px + env(safe-area-inset-bottom));}
.navitem{position:relative;justify-content:center;gap:3px;min-height:54px;border-radius:12px;color:var(--muted);font-size:10px;font-weight:550;letter-spacing:.05px;transition:color .18s ease,background .18s ease,transform .18s ease; -webkit-tap-highlight-color:transparent;}
.navitem b{width:27px;height:25px;display:grid;place-items:center;font-size:0;line-height:1;}
.navitem svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;}
.navitem.active{color:var(--accent);background:var(--accent-soft);font-weight:700;}
.navitem:active{transform:scale(.94);}
.conversation{opacity:0;transform:translateY(9px) scale(.99);transform-origin:center bottom;}
.conversation.chat-enter{animation:veltoChatEnter .32s cubic-bezier(.2,.75,.25,1) both;}
.messages{overscroll-behavior:contain;}
@keyframes veltoChatEnter{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(prefers-reduced-motion:reduce){.conversation.chat-enter{animation:none;opacity:1;transform:none}.navitem{transition:none}}
@media(max-width:650px){.bottomnav{padding:7px 8px calc(7px + env(safe-area-inset-bottom));}.navitem{min-height:56px;border-radius:12px;font-size:10px}.navitem b{height:25px}.conversation.chat-enter{animation-duration:.28s}}

<style>

/* Velto Glass Panels — additive styling, no JavaScript or event-handler changes. */
:root {
  --velto-glass-bg: color-mix(in srgb, var(--panel, #111a15) 72%, transparent);
  --velto-glass-border: color-mix(in srgb, var(--line, #ffffff22) 78%, #ffffff 22%);
  --velto-glass-shadow: 0 12px 36px rgba(0, 0, 0, .16), inset 0 1px 0 rgba(255,255,255,.055);
}
/* Glass surfaces for the main navigation, chat composer and floating dialogs. */
.sidebar,
.top,
.composer,
.bottomnav,
.modal,
.reaction-picker,
.authcard,
#profile-modal .modal,
#settings-modal .modal,
#admin-modal .modal {
  background-color: var(--velto-glass-bg);
  border-color: var(--velto-glass-border);
  box-shadow: var(--velto-glass-shadow);
  -webkit-backdrop-filter: blur(20px) saturate(145%);
  backdrop-filter: blur(20px) saturate(145%);
}
.sidebar { background-color: color-mix(in srgb, var(--sidebar, #101713) 82%, transparent); }
.top { border-bottom: 1px solid color-mix(in srgb, var(--line, #ffffff22) 70%, transparent); }
.composer { border-top: 1px solid var(--velto-glass-border); }
.bottomnav { border-top: 1px solid var(--velto-glass-border); }
.modal { background-color: color-mix(in srgb, var(--modal, #151d18) 84%, transparent); }
/* Inputs and buttons get a subtle translucent surface without changing their behavior. */
.composeinput,
.field input,
.field select,
.field textarea,
.iconbtn,
.secondarybtn,
.reaction-picker button,
[data-glass="true"] {
  -webkit-backdrop-filter: blur(12px) saturate(135%);
  backdrop-filter: blur(12px) saturate(135%);
}
.composeinput,
.field input,
.field select,
.field textarea,
[data-glass="true"] {
  border: 1px solid color-mix(in srgb, var(--line, #ffffff22) 72%, #ffffff 18%);
  background-color: color-mix(in srgb, var(--panel, #111a15) 72%, transparent);
}
.iconbtn,
.secondarybtn,
.reaction-picker button {
  transition: background-color .2s ease, border-color .2s ease, transform .2s ease, box-shadow .2s ease;
}
.iconbtn:active,
.secondarybtn:active,
.reaction-picker button:active { transform: scale(.96); }
/* Optional reusable glass panel class for future profile/settings sections. */
.glass-panel {
  background: var(--velto-glass-bg);
  border: 1px solid var(--velto-glass-border);
  border-radius: 18px;
  box-shadow: var(--velto-glass-shadow);
  -webkit-backdrop-filter: blur(20px) saturate(145%);
  backdrop-filter: blur(20px) saturate(145%);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .sidebar, .top, .composer, .bottomnav, .modal, .reaction-picker, .authcard, .glass-panel {
    background-color: var(--panel, #111a15);
  }
}
@media (prefers-reduced-motion: reduce) {
  .iconbtn, .secondarybtn, .reaction-picker button { transition: none; }
}

</style>
